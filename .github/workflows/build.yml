name: Build & Release Notes Ecosystem

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          pytest tests/ -v

  # ── Frontend Build ─────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build (Svelte 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ── Windows PyInstaller EXE ────────────────────────────────────────────────
  build-pyinstaller-windows:
    name: Windows Desktop (PyInstaller EXE)
    needs: [test-backend, build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build Windows EXE with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --name "Notes-Workstation-Windows" `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "app;app" `
            --add-data "config;config" `
            --hidden-import "config" `
            --hidden-import "flask" `
            --hidden-import "flask_restx" `
            --hidden-import "flask_sqlalchemy" `
            --hidden-import "flask_migrate" `
            --hidden-import "sqlalchemy" `
            --hidden-import "werkzeug" `
            --hidden-import "webview" `
            --collect-all "webview" `
            desktop.py

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Notes-Workstation-Windows.exe

  # ── Tauri Desktop (Windows + Linux) ───────────────────────────────────────
  build-desktop:
    name: Tauri Desktop (${{ matrix.platform }})
    needs: [test-backend, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install root and frontend dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build Tauri Desktop App
        run: npx tauri build
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Android APK ───────────────────────────────────────────────────────────
  build-android:
    name: Android Build (APK)
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
      - name: Install Rust and Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build Android Release APK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export NDK_HOME="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          npx tauri android init --ci
          python3 scripts/patch_android_camera.py
          npx tauri android build --apk --target aarch64

      - name: Sign & Align Android Release APK
        run: |
          mkdir -p release-apk
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"

          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias notesworkstation -keyalg RSA -keysize 2048 -validity 10000 -storepass notes1234 -keypass notes1234 -dname "CN=NotesWorkstation, OU=Notes, O=Notes, L=Global, S=Global, C=US"
          fi

          UNSIGNED_APK=$(find src-tauri/gen/android/ -name "*universal-release-unsigned.apk" -o -name "*release-unsigned.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk

          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore --ks-pass pass:notes1234 --key-pass pass:notes1234 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out release-apk/Notes-Workstation-Android-Universal-v${APP_VERSION}.apk aligned.apk

          $BUILD_TOOLS_DIR/apksigner verify -v release-apk/Notes-Workstation-Android-Universal-v${APP_VERSION}.apk
          cp release-apk/Notes-Workstation-Android-Universal-v${APP_VERSION}.apk release-apk/Notes-Workstation-Android-v${APP_VERSION}.apk

      - name: Build Android Debug APK (Pre-signed Fallback)
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export NDK_HOME="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          npx tauri android build --apk --debug --target aarch64
          DEBUG_APK=$(find src-tauri/gen/android/ -name "*debug.apk" | head -n 1)
          echo "Found debug APK: $DEBUG_APK"
          cp "$DEBUG_APK" release-apk/Notes-Workstation-Android-Debug-v${APP_VERSION}.apk
          ls -lh release-apk/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/*.apk

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled()
    needs: [build-pyinstaller-windows, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Binaries
        run: |
          mkdir -p release-assets
          # Installer scripts
          [ -f install.ps1 ] && cp install.ps1 release-assets/Notes-Workstation-Installer-Windows.ps1 || true
          [ -f install.sh  ] && cp install.sh  release-assets/Notes-Workstation-Installer-Linux.sh    || true

          # All built binaries
          find artifacts/ -type f \( \
            -name "*.apk" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.deb" -o \
            -name "*.AppImage" \
          \) -exec cp {} release-assets/ \;

          ls -lh release-assets/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.1.2"
          TITLE="Notes Workstation v2.1.2 — Database Auto-Creation Fix & Persistent Storage"
          cat << 'EOF' > release_notes.md
          ### Notes Workstation v2.1.2

          #### What's new in this release

          - **Fix Database Missing Table Error (`no such table: lesson`)**: Automatically ensures SQLite database tables are created on startup via `db.create_all()`. Standalone `.exe` runs now work out-of-the-box on fresh Windows installs without manual migrations!
          - **Automatic Port Conflict Resolution**: If port 5000 is occupied by another service or previously running instance, the application now automatically detects the conflict, seeks the next available port (5001, 5002...), dynamically binds to it, updates the discovery beacon, and opens the interface without errors.
          - **Persistent SQLite Storage**: Portable standalone `.exe` now safely persists its SQLite database in the user data directory (`~/.notes_workstation/notes.db`), ensuring notes and settings are never lost across restarts.
          - **Native Android Camera Permission Prompt**: The Android app now triggers the native OS camera permission dialog (*"Allow Notes Workstation to take pictures and record video?"*) when tapping `📷 Scan QR Code`, bridging `WebChromeClient.onPermissionRequest` to Android's runtime permission system.
          - **In-App Camera QR Code Scanner**: Added a dedicated `📷 Scan QR Code` live camera viewfinder directly inside the Device Sync & Pairing modal! Supports phones, tablets, and laptops with webcams via `html5-qrcode`.
          - **Instant Auto-Connect**: Scanning a Wi-Fi or Tailscale connection QR code instantly switches your mobile device backend URL, verifies connectivity, and synchronizes real-time P2P notes immediately without manual typing.
          - **Smart Connect Field**: The manual connect box now intelligently parses both raw HTTP/HTTPS URLs (`http://192.168.0.45:5000`) and JSON cryptographic pairing tokens.
          - **GLiNER Neural NER**: On-demand download of the GLiNER model for academic entity extraction.
          - **Zero-config LAN Mesh Discovery**: UDP beacon on port 58856 auto-discovers all peers on the same network.
          - **Tailscale Cross-Network Support**: Desktop app runs with `--tailscale` to connect across different networks.
          - **High-Contrast Code Blocks**: Dracula-inspired palette (`#0f1017` background, vivid token colours).

          #### Downloads

          | Platform | File |
          |---|---|
          | Windows (standalone portable EXE) | `Notes-Workstation-Windows.exe` |
          | Windows (MSI installer) | `*.msi` |
          | Linux (Deb package) | `*.deb` |
          | Linux (AppImage) | `*.AppImage` |
          | Android (Universal APK) | `Notes-Workstation-Android-Universal-*.apk` |

          #### Usage — Tailscale cross-network

          ```powershell
          # Windows
          Notes-Workstation-Windows.exe --tailscale

          # Python (dev)
          python desktop.py --tailscale
          ```

          The app will auto-start Tailscale, print your Tailscale IP, and display it in the connection-info block at startup. Share the `http://100.x.x.x:5000` URL with any device on your Tailnet.
          EOF

          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" release-assets/* --title "$TITLE" --notes-file release_notes.md --latest
          gh release upload "$TAG_NAME" release-assets/* --clobber

