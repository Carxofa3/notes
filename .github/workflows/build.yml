name: Build & Release Notes Ecosystem

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          pytest tests/ -v

  build-frontend:
    name: Frontend Build (Svelte 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-desktop:
    name: Desktop Build (${{ matrix.platform }})
    needs: [test-backend, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install root and frontend dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build Tauri Desktop App
        run: npx tauri build
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-android:
    name: Android Build (APK)
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
      - name: Install Rust and Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build Android Release APK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export NDK_HOME="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Sign & Align Android Release APK
        run: |
          mkdir -p release-apk
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"
          
          # Use checked-in permanent release keystore if present, otherwise generate
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias notesworkstation -keyalg RSA -keysize 2048 -validity 10000 -storepass notes1234 -keypass notes1234 -dname "CN=NotesWorkstation, OU=Notes, O=Notes, L=Global, S=Global, C=US"
          fi
          
          # Locate unsigned APK
          UNSIGNED_APK=$(find src-tauri/gen/android/ -name "*universal-release-unsigned.apk" -o -name "*release-unsigned.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          
          # Align 4-byte boundaries
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          
          # Sign with v1, v2, v3 signature schemes
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:notes1234 --key-pass pass:notes1234 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out release-apk/Notes-Workstation-Android-Universal-v${APP_VERSION}.apk aligned.apk
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify -v release-apk/Notes-Workstation-Android-Universal-v${APP_VERSION}.apk
          
          # Also copy as default APK name
          cp release-apk/Notes-Workstation-Android-Universal-v${APP_VERSION}.apk release-apk/Notes-Workstation-Android-v${APP_VERSION}.apk

      - name: Build Android Debug APK (Pre-signed Fallback)
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export NDK_HOME="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          npx tauri android build --apk --debug --target aarch64
          DEBUG_APK=$(find src-tauri/gen/android/ -name "*debug.apk" | head -n 1)
          echo "Found debug APK: $DEBUG_APK"
          cp "$DEBUG_APK" release-apk/Notes-Workstation-Android-Debug-v${APP_VERSION}.apk
          ls -lh release-apk/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/*.apk

  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled()
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect Release Binaries
        run: |
          mkdir -p release-assets
          cp install.ps1 release-assets/Notes-Workstation-Installer-Windows.ps1
          cp install.sh release-assets/Notes-Workstation-Installer-Linux.sh
          
          # Find all installers and APKs from downloaded artifacts
          find artifacts/ -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets/
      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.0.3"
          TITLE="Notes Workstation v2.0.3 — Obsidian-Style Live Preview & Zero-Sample Clean Slate"
          NOTES="### Notes Workstation v2.0.3 Release Packages
          
          This release introduces a unified Obsidian-style Live Preview editor, high-contrast text rendering, zero sample data, and direct course deletion:
          - **Obsidian-Style Live Preview Editor**: Joined preview and plain text into a single unified workspace powered by CodeMirror 6 and live markdown rendering. Headings, bold/italic, tables, code blocks, and KaTeX math formulas render live in-place while remaining directly editable.
          - **Crystal-Clear Text Visibility**: Full high-contrast input and caret rendering across all 5 themes (Catppuccin Mocha, Paper White Light, Solarized Dark, Cyberpunk, AMOLED), resolving Android WebView contrast and dark mode text issues.
          - **Clean Zero-Sample Slate**: Removed all mock/starter courses, units, and notes. The app starts 100% clean and automatically purges legacy sample cache from localStorage.
          - **Direct Course Deletion**: Added direct delete (\`🗑️\`) buttons to course tabs and cascade deletion for all associated folders and notes.
          - **File Explorer & Customization**: Customizable folder/note icons and colors, smart auto-categorization, and persistent navigation drawer.

          #### Downloads:
          - **Android (Universal APK)**: \`Notes-Workstation-Android-Universal-v2.0.3.apk\`
          - **Windows Desktop**: \`*.exe\`, \`*.msi\`, \`install.ps1\`
          - **Linux**: \`*.deb\`, \`*.AppImage\`, \`install.sh\`"
            
          # Create or edit release
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" release-assets/* --title "$TITLE" --notes "$NOTES" --latest
          gh release upload "$TAG_NAME" release-assets/* --clobber
