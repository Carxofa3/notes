name: Build & Release Notes Ecosystem

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          pytest tests/ -v

  build-frontend:
    name: Frontend Build (Svelte 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-desktop:
    name: Desktop Build (${{ matrix.platform }})
    needs: [test-backend, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install root and frontend dependencies
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Build Tauri Desktop App
        run: npx tauri build
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os_name }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-android:
    name: Android Build (APK)
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
      - name: Install Rust and Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64-linux-android
      - name: Find and Prepare APK
        run: |
          mkdir -p release-apk
          find src-tauri/gen/android/ -name "*.apk" -exec cp {} release-apk/Notes-Workstation-Android-v2.0.0.apk \;
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-apk/*.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect Release Binaries
        run: |
          mkdir -p release-assets
          cp install.ps1 release-assets/Notes-Workstation-Installer-Windows.ps1
          cp install.sh release-assets/Notes-Workstation-Installer-Linux.sh
          
          # Find all installers and APKs from downloaded artifacts
          find artifacts/ -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -la release-assets/
      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.0.0"
          TITLE="Notes Workstation v2.0.0 — University Knowledge & Fact-Checking Workstation"
          NOTES="### Notes Workstation v2.0.0 Release Packages
          
          Welcome to Notes Workstation v2.0.0! Built specifically for STEM university students with real-time multi-source fact-checking, course lecture slide RAG, llama.cpp escalation, and P2P synchronization.

          #### Downloads by Device & OS:
          - **Android Phones & Tablets**: \`Notes-Workstation-Android-v2.0.0.apk\` (Native ARM64 / JNI WebView)
          - **Windows Desktop**: 
            - \`notes-workstation_0.1.0_x64-setup.exe\` (NSIS Easy Setup Installer)
            - \`notes-workstation_0.1.0_x64_en-US.msi\` (Windows Installer Package)
            - \`Notes-Workstation-Installer-Windows.ps1\` (Automated Desktop Shortcut Setup)
          - **Linux (Ubuntu, Debian, Fedora, Arch)**:
            - \`*.deb\` Debian/Ubuntu Package
            - \`*.AppImage\` Standalone Executable
            - \`Notes-Workstation-Installer-Linux.sh\` (Automated App Menu Setup)
          - **Universal Desktop Runner**:
            - Run \`desktop.py\` or double-click \`run_desktop.bat\` / \`run_desktop.sh\`."
            
          # Create or edit release
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" release-assets/* --title "$TITLE" --notes "$NOTES" --latest
          gh release upload "$TAG_NAME" release-assets/* --clobber
