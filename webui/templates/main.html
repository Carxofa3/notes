<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNote - Classroom Notetaking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Base styles for CSS variables */
        :root {
            /* Light Theme */
            --color-text-primary: #1a202c;
            --color-background-primary: #f7fafe;
            --color-accent: #4299e1;
            --color-accent-light: #ebf8ff;
            
            --color-border-subtle: rgba(26, 32, 44, 0.1);
            --color-background-secondary: #ffffff;
            --color-text-muted: #718096;
            --color-text-inverted: #ffffff;
        }
        
        .dark {
            /* Dark Theme */
            --color-text-primary: #e2e8f0;
            --color-background-primary: #1a202c;
            --color-accent: #63b3ed;
            --color-accent-light: #1a2430;
            
            --color-border-subtle: rgba(226, 232, 240, 0.1);
            --color-background-secondary: #2d3748;
            --color-text-muted: #a0aec0;
        }
        
        body {
            background-color: var(--color-background-primary);
            color: var(--color-text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
    </style>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                'primary': 'var(--color-text-primary)',
                'background': 'var(--color-background-primary)',
                'accent': 'var(--color-accent)',
                'accent-light': 'var(--color-accent-light)',
                'border-subtle': 'var(--color-border-subtle)',
                'background-secondary': 'var(--color-background-secondary)',
                'text-muted': 'var(--color-text-muted)',
                'text-inverted': 'var(--color-text-inverted)'
              }
            }
          }
        }
    </script>
</head>
<body class="min-h-screen flex font-sans">
    <!-- Sidebar for lessons and units -->
    <aside class="w-64 border-r border-border-subtle bg-background-secondary h-full overflow-y-auto fixed left-0 top-0">
        <div class="p-5 border-b border-border-subtle">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-book-open text-accent"></i>
                EduNote
            </h1>
            <p class="text-xs text-text-muted mt-1">Classroom Notetaking App</p>
        </div>
        
        <!-- Theme switcher -->
        <div class="px-4 py-3 bg-background-secondary border-b border-border-subtle">
            <button id="theme-toggle" class="flex items-center gap-2 w-full text-left p-2 rounded-lg hover:bg-accent-light transition-colors">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block"></i>
                <span>Dark Mode</span>
            </button>
        </div>
        
        <!-- Lessons (folders) -->
        <div class="px-3 py-2">
            <div class="flex justify-between items-center">
                <h2 class="text-xs uppercase text-text-muted tracking-wider font-semibold">Lessons</h2>
                <button id="new-lesson-btn" class="text-text-muted hover:text-accent transition-colors">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <ul id="lessons-list" class="mt-1 space-y-1">
                <!-- Lesson items will be dynamically added here -->
            </ul>
        </div>
        
        <!-- Units within a lesson -->
        <div class="px-3 py-4 mt-6 bg-background-secondary border-t border-border-subtle rounded-lg mx-2">
            <div class="flex justify-between items-center">
                <h2 class="text-xs uppercase text-text-muted tracking-wider font-semibold">Units</h2>
                <button id="new-unit-btn" class="text-text-muted hover:text-accent transition-colors">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <ul id="units-list" class="mt-1 space-y-1">
                <!-- Unit items will be dynamically added here -->
            </ul>
        </div>
    </aside>

    <!-- Main content area -->
    <main class="flex-1 ml-64 p-5 overflow-y-auto">
        <!-- Header with actions -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-bold" id="current-unit-title">Algebra Basics</h2>
                <p class="text-sm text-text-muted" id="current-note-count">3 notes in this unit</p>
            </div>
            <div class="flex gap-2">
                <button id="new-note-btn" class="flex items-center gap-2 px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors">
                    <i class="fas fa-plus"></i> New Note
                </button>
                <button id="delete-notes-btn" class="flex items-center gap-2 px-4 py-2 bg-red-500 text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors hidden">
                    <i class="fas fa-trash"></i> Delete
                </button>
                <button id="edit-title-btn" class="flex items-center gap-2 px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors hidden">
                    <i class="fas fa-edit"></i> Edit Title
                </button>
                <button id="download-notes-btn" class="flex items-center gap-2 px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors hidden">
                    <i class="fas fa-download"></i> Download
                </button>
                <button id="move-notes-btn" class="flex items-center gap-2 px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors hidden">
                    <i class="fas fa-exchange-alt"></i> Move
                </button>
            </div>
        </div>
        
        <!-- Notes list -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="notes-container">
            <!-- Note cards will be dynamically added here -->
        </div>
    </main>

    <!-- Fullscreen Note Editor -->
    <div id="note-editor" class="fixed inset-0 bg-background-secondary z-50 hidden">
        <div class="flex flex-col h-full">
            <!-- Editor Header -->
            <div class="border-b border-border-subtle p-4 flex justify-between items-center">
                <h3 class="font-medium" id="editor-title">New Note</h3>
                <div class="flex gap-2">
                    <button id="close-editor" class="px-3 py-1 text-text-muted hover:text-accent transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <!-- Editor Content -->
            <div class="flex flex-1 overflow-hidden">
                <!-- Markdown Preview (replacing text editor) -->
                <div class="flex-1 flex flex-col">
                    <div id="editor-content" class="flex-1 p-4 overflow-y-auto prose dark:prose-invert"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add New Unit Modal -->
    <div id="unit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-background-secondary rounded-xl w-full max-w-md mx-auto border border-border-subtle overflow-hidden">
            <div class="p-4 border-b border-border-subtle flex justify-between items-center">
                <h3 class="font-medium" id="unit-modal-title">New Unit</h3>
                <button id="close-unit-modal" class="text-text-muted hover:text-accent transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4">
                <input type="text" id="unit-name" class="w-full p-3 bg-transparent border-b border-border-subtle focus:outline-none focus:border-accent transition-colors" placeholder="Unit name" required>
                <div class="mt-4 flex justify-end gap-2">
                    <button id="cancel-unit-btn" class="px-4 py-2 text-text-muted hover:text-accent transition-colors">Cancel</button>
                    <button id="save-unit" class="px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors">Create Unit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add New Lesson Modal -->
    <div id="lesson-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-background-secondary rounded-xl w-full max-w-md mx-auto border border-border-subtle overflow-hidden">
            <div class="p-4 border-b border-border-subtle flex justify-between items-center">
                <h3 class="font-medium" id="lesson-modal-title">New Lesson</h3>
                <button id="close-lesson-modal" class="text-text-muted hover:text-accent transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4">
                <input type="text" id="lesson-name" class="w-full p-3 bg-transparent border-b border-border-subtle focus:outline-none focus:border-accent transition-colors" placeholder="Lesson title" required>
                <div class="mt-4 flex justify-end gap-2">
                    <button id="cancel-lesson-btn" class="px-4 py-2 text-text-muted hover:text-accent transition-colors">Cancel</button>
                    <button id="save-lesson" class="px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors">Create Lesson</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Note Title Modal -->
    <div id="edit-title-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-background-secondary rounded-xl w-full max-w-md mx-auto border border-border-subtle overflow-hidden">
            <div class="p-4 border-b border-border-subtle flex justify-between items-center">
                <h3 class="font-medium">Edit Note Title</h3>
                <button id="close-edit-title-modal" class="text-text-muted hover:text-accent transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4">
                <input type="text" id="edit-note-title" class="w-full p-3 bg-transparent border-b border-border-subtle focus:outline-none focus:border-accent transition-colors" placeholder="Note title" required>
                <div class="mt-4 flex justify-end gap-2">
                    <button id="cancel-edit-title-btn" class="px-4 py-2 text-text-muted hover:text-accent transition-colors">Cancel</button>
                    <button id="save-edit-title" class="px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors">Save Title</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Move Notes Modal -->
    <div id="move-notes-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-background-secondary rounded-xl w-full max-w-md mx-auto border border-border-subtle overflow-hidden">
            <div class="p-4 border-b border-border-subtle flex justify-between items-center">
                <h3 class="font-medium">Move Notes</h3>
                <button id="close-move-notes-modal" class="text-text-muted hover:text-accent transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Select Lesson:</label>
                    <select id="move-lesson-select" class="w-full p-3 bg-transparent border border-border-subtle rounded-lg focus:outline-none focus:border-accent transition-colors">
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Select Unit:</label>
                    <select id="move-unit-select" class="w-full p-3 bg-transparent border border-border-subtle rounded-lg focus:outline-none focus:border-accent transition-colors">
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
                <div class="flex justify-end gap-2">
                    <button id="cancel-move-notes-btn" class="px-4 py-2 text-text-muted hover:text-accent transition-colors">Cancel</button>
                    <button id="save-move-notes" class="px-4 py-2 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors">Move Notes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample data structure
        const appData = {
            lessons: [
                {
                    id: 1,
                    title: "Introduction to Algebra",
                    units: [
                        { id: 1, title: "Variables and Expressions", notes: [1,2] },
                        { id: 2, title: "Order of Operations", notes: [3] }
                    ]
                },
                {
                    id: 2,
                    title: "Linear Equations",
                    units: [
                        { id: 1, title: "Solving One-Step Equations", notes: [4,5] },
                        { id: 2, title: "Multi-step Equations", notes: [6] }
                    ]
                },
                {
                    id: 3,
                    title: "Functions and Graphs",
                    units: [
                        { id: 1, title: "Function Basics", notes: [7] },
                        { id: 2, title: "Slope and Intercepts", notes: [8,9] }
                    ]
                }
            ],
            notes: [
                { id: 1, lessonId: 1, unitId: 1, title: "What is a variable?", content: "A variable is a symbol that represents a quantity that can change or vary.", color: "bg-blue-100 text-blue-800" },
                { id: 2, lessonId: 1, unitId: 1, title: "Combining like terms", content: "Like terms are terms that have the same variable raised to the same power. You can combine them by adding or subtracting coefficients.", color: "bg-blue-100 text-blue-800" },
                // ... more notes
            ]
        };

        // DOM Elements
        const lessonsList = document.getElementById('lessons-list');
        const unitsList = document.getElementById('units-list');
        const notesContainer = document.getElementById('notes-container');
        const noteEditor = document.getElementById('note-editor');
        const unitModal = document.getElementById('unit-modal');
        const lessonModal = document.getElementById('lesson-modal');
        const editTitleModal = document.getElementById('edit-title-modal');
        const moveNotesModal = document.getElementById('move-notes-modal');
        const themeToggle = document.getElementById('theme-toggle');
        const newNoteBtn = document.getElementById('new-note-btn');
        const newLessonBtn = document.getElementById('new-lesson-btn');
        const newUnitBtn = document.getElementById('new-unit-btn');
        const closeEditor = document.getElementById('close-editor');
        const editorContent = document.getElementById('editor-content'); // This is now the markdown preview area
        const editorTitle = document.getElementById('editor-title');
        const unitModalTitle = document.getElementById('unit-modal-title');
        const lessonModalTitle = document.getElementById('lesson-modal-title');
        const closeUnitModal = document.getElementById('close-unit-modal');
        const cancelUnitBtn = document.getElementById('cancel-unit-btn');
        const saveUnitBtn = document.getElementById('save-unit');
        const closeLessonModal = document.getElementById('close-lesson-modal');
        const cancelLessonBtn = document.getElementById('cancel-lesson-btn');
        const saveLessonBtn = document.getElementById('save-lesson');
        const closeEditTitleModal = document.getElementById('close-edit-title-modal');
        const cancelEditTitleBtn = document.getElementById('cancel-edit-title-btn');
        const saveEditTitleBtn = document.getElementById('save-edit-title');
        const closeMoveNotesModal = document.getElementById('close-move-notes-modal');
        const cancelMoveNotesBtn = document.getElementById('cancel-move-notes-btn');
        const saveMoveNotesBtn = document.getElementById('save-move-notes');
        const moveLessonSelect = document.getElementById('move-lesson-select');
        const moveUnitSelect = document.getElementById('move-unit-select');

        // Current state
        let currentLessonId = 1;
        let currentUnitId = 1;
        let currentNoteId = null;
        let selectedNotes = []; // Array to store selected note IDs

        // Initialize the app
        function initApp() {
            renderLessons();
            renderUnits();
            renderNotes();
        }

        // Render lessons list
        function renderLessons() {
            lessonsList.innerHTML = '';
            
            appData.lessons.forEach(lesson => {
                const lessonItem = document.createElement('li');
                lessonItem.className = 'sidebar-item flex items-center gap-3 py-2 px-3 rounded-lg cursor-pointer transition-colors hover:bg-[var(--color-accent-light)] hover:text-[var(--color-accent)]';
                
                // Set active class if this is the current lesson
                if (currentLessonId === lesson.id) {
                    lessonItem.classList.add('bg-accent-light', 'font-medium');
                }
                
                lessonItem.innerHTML = `
                    <i class="fas fa-folder text-text-muted"></i>
                    <span>${lesson.title}</span>
                `;
                
                lessonItem.addEventListener('click', () => {
                    // Remove active class from all lessons
                    document.querySelectorAll('#lessons-list .sidebar-item').forEach(item => {
                        item.classList.remove('bg-accent-light', 'font-medium');
                    });
                    
                    // Add active class to clicked lesson
                    lessonItem.classList.add('bg-accent-light', 'font-medium');
                    
                    currentLessonId = lesson.id;
                    
                    // Auto-select the first unit of the new lesson
                    const firstUnit = lesson.units[0];
                    if (firstUnit) {
                        currentUnitId = firstUnit.id;
                    }
                    
                    // Clear selected notes when changing lessons
                    selectedNotes = [];
                    
                    renderUnits();
                    renderNotes();
                    updateActionButtons();
                });
                
                lessonsList.appendChild(lessonItem);
            });
        }

 // Render units list
 function renderUnits() {
    unitsList.innerHTML = '';
    
    const currentLesson = appData.lessons.find(lesson => lesson.id === currentLessonId);
    
    if (!currentLesson) return;
    
    currentLesson.units.forEach(unit => {
        const unitItem = document.createElement('li');
        unitItem.className = 'sidebar-item flex items-center gap-3 py-2 px-3 rounded-lg cursor-pointer transition-colors hover:bg-[var(--color-accent-light)] hover:text-[var(--color-accent)]';

        // Set active class if this is the current unit
        if (currentUnitId === unit.id) {
            unitItem.classList.add('bg-accent-light', 'font-medium');
        }

        unitItem.innerHTML = `
            <i class="fas fa-book text-text-muted"></i>
            <span>${unit.title}</span>
        `;
        
        unitItem.addEventListener('click', () => {
            // Remove active class from all units
            document.querySelectorAll('#units-list .sidebar-item').forEach(item => {
                item.classList.remove('bg-accent-light', 'font-medium');
            });
            
            // Add active class to clicked unit
            unitItem.classList.add('bg-accent-light', 'font-medium');
            
            currentUnitId = unit.id;
            renderNotes();
            updateCurrentUnitTitle();
        });
        
        unitsList.appendChild(unitItem);
    });
}

// Open fullscreen note editor for new note
function openNoteEditor() {
    noteEditor.classList.remove('hidden');
    currentNoteId = null;
    editorTitle.textContent = 'New Note';
    editorContent.innerHTML = ''; // Clear content for new note
}

// Open fullscreen note editor for existing note
function openEditNoteEditor(note) {
    noteEditor.classList.remove('hidden');
    currentNoteId = note.id;
    editorTitle.textContent = 'Edit Note';
    editorContent.innerHTML = marked.parse(note.content); // Render markdown directly
}

// Update markdown preview function is no longer needed

// Close fullscreen note editor
function closeNoteEditor() {
    noteEditor.classList.add('hidden');
}

// Save note from fullscreen editor
function saveNoteFromEditor() {
    const content = editorContent.value.trim();
    if (content) {
        if (currentNoteId === null) {
            // Create new note
            const newNote = {
                id: appData.notes.length + 1,
                lessonId: currentLessonId,
                unitId: currentUnitId,
                title: "Note " + (appData.notes.length + 1),
                content: content,
                color: "bg-blue-100 text-blue-800"
            };
            appData.notes.push(newNote);
        } else {
            // Update existing note
            const note = appData.notes.find(n => n.id === currentNoteId);
            if (note) {
                note.content = content;
            }
        }
        closeNoteEditor();
        renderNotes();
    }
}

// Render notes for the current unit and lesson
function renderNotes() {
    notesContainer.innerHTML = '';
    
    const currentLesson = appData.lessons.find(lesson => lesson.id === currentLessonId);
    if (!currentLesson) return;
    
    const currentUnit = currentLesson.units.find(unit => unit.id === currentUnitId);
    if (!currentUnit) return;
    
    // Update the current unit title and note count
    updateCurrentUnitTitle();
    
    // Filter notes for the current unit
    const unitNotes = appData.notes.filter(note => note.lessonId === currentLessonId && note.unitId === currentUnitId);
    
    // For each note in the current unit and lesson
    unitNotes.forEach(note => {
        // For each note, render a card
        const noteCard = document.createElement('div');
        noteCard.className = 'note-card bg-background-secondary border border-border-subtle rounded-xl p-4 overflow-hidden cursor-pointer transition-colors hover:scale-[1.02] hover:shadow-lg relative';
        
        // Note content with checkbox
        noteCard.innerHTML = `
            <div class="absolute top-2 right-2">
                <input type="checkbox" class="note-checkbox w-5 h-5 text-accent rounded focus:ring-accent" data-note-id="${note.id}">
            </div>
            <div class="flex items-start gap-3">
                <span class="text-sm font-bold ${note.color}">${note.title}</span>
            </div>
            <p class="mt-2 text-text-muted">${note.content}</p>
        `;
        
        // Add click event to edit note
        noteCard.addEventListener('click', (e) => {
            // If the click was on the checkbox, don't open the editor
            if (e.target.classList.contains('note-checkbox')) return;
            openEditNoteEditor(note);
        });
        
        // Add change event to checkbox
        const checkbox = noteCard.querySelector('.note-checkbox');
        checkbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                selectedNotes.push(note.id);
            } else {
                selectedNotes = selectedNotes.filter(id => id !== note.id);
            }
            updateActionButtons();
        });
        
        notesContainer.appendChild(noteCard);
    });
}

// Update current unit title and note count
function updateCurrentUnitTitle() {
    const currentLesson = appData.lessons.find(lesson => lesson.id === currentLessonId);
    if (!currentLesson) return;
    
    const currentUnit = currentLesson.units.find(unit => unit.id === currentUnitId);
    if (!currentUnit) return;
    
    document.getElementById('current-unit-title').textContent = currentUnit.title;
    
    // Count notes for this unit
    const unitNotes = appData.notes.filter(note => note.lessonId === currentLessonId && note.unitId === currentUnitId);
    document.getElementById('current-note-count').textContent = `${unitNotes.length} note${unitNotes.length !== 1 ? 's' : ''} in this unit`;
}

// Open new unit modal
function openUnitModal() {
    unitModal.classList.remove('hidden');
    document.getElementById('unit-name').value = '';
    document.getElementById('unit-modal-title').textContent = 'New Unit';
}

// Open new lesson modal
function openLessonModal() {
    lessonModal.classList.remove('hidden');
    document.getElementById('lesson-name').value = '';
    document.getElementById('lesson-modal-title').textContent = 'New Lesson';
}

// Add a save button to the fullscreen editor
const saveButton = document.createElement('button');
saveButton.id = 'save-note-btn';
saveButton.className = 'px-3 py-1 bg-accent text-background-secondary rounded-lg font-medium hover:bg-opacity-90 transition-colors ml-2';
saveButton.textContent = 'Save Note';
document.querySelector('#note-editor .flex.justify-between.items-center').appendChild(saveButton);

// Event listener for save button in fullscreen editor
saveButton.addEventListener('click', saveNoteFromEditor);

// Event listeners for unit modal
closeUnitModal.addEventListener('click', () => {
    unitModal.classList.add('hidden');
});

cancelUnitBtn.addEventListener('click', () => {
    unitModal.classList.add('hidden');
});

saveUnitBtn.addEventListener('click', () => {
    const unitName = document.getElementById('unit-name').value.trim();
    if (unitName) {
        const currentLesson = appData.lessons.find(lesson => lesson.id === currentLessonId);
        if (currentLesson) {
            const newUnit = {
                id: currentLesson.units.length + 1,
                title: unitName,
                notes: []
            };
            currentLesson.units.push(newUnit);
            unitModal.classList.add('hidden');
            renderUnits();
        }
    }
});

// Event listeners for lesson modal
closeLessonModal.addEventListener('click', () => {
    lessonModal.classList.add('hidden');
});

cancelLessonBtn.addEventListener('click', () => {
    lessonModal.classList.add('hidden');
});

saveLessonBtn.addEventListener('click', () => {
    const lessonName = document.getElementById('lesson-name').value.trim();
    if (lessonName) {
        const newLesson = {
            id: appData.lessons.length + 1,
            title: lessonName,
            units: []
        };
        appData.lessons.push(newLesson);
        lessonModal.classList.add('hidden');
        renderLessons();
    }
});

// Theme toggle
themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
});

// New note button
newNoteBtn.addEventListener('click', openNoteEditor);

// New lesson button
newLessonBtn.addEventListener('click', openLessonModal);

// New unit button
newUnitBtn.addEventListener('click', openUnitModal);

// Close editor button
closeEditor.addEventListener('click', closeNoteEditor);

// Delete notes button
document.getElementById('delete-notes-btn').addEventListener('click', deleteSelectedNotes);

// Edit title button
document.getElementById('edit-title-btn').addEventListener('click', openEditTitleModal);

// Edit title modal event listeners
closeEditTitleModal.addEventListener('click', () => {
    editTitleModal.classList.add('hidden');
});

cancelEditTitleBtn.addEventListener('click', () => {
    editTitleModal.classList.add('hidden');
});

saveEditTitleBtn.addEventListener('click', saveEditedTitle);

// Download notes button
document.getElementById('download-notes-btn').addEventListener('click', downloadSelectedNotes);

// Move notes button
document.getElementById('move-notes-btn').addEventListener('click', openMoveNotesModal);

// Move notes modal event listeners
closeMoveNotesModal.addEventListener('click', () => {
    moveNotesModal.classList.add('hidden');
});

cancelMoveNotesBtn.addEventListener('click', () => {
    moveNotesModal.classList.add('hidden');
});

saveMoveNotesBtn.addEventListener('click', moveSelectedNotes);

// Update unit options when lesson selection changes
moveLessonSelect.addEventListener('change', populateUnitOptions);

// Update action buttons based on selected notes
function updateActionButtons() {
    const deleteBtn = document.getElementById('delete-notes-btn');
    const editTitleBtn = document.getElementById('edit-title-btn');
    const downloadBtn = document.getElementById('download-notes-btn');
    const moveBtn = document.getElementById('move-notes-btn');
    
    if (selectedNotes.length > 0) {
        deleteBtn.classList.remove('hidden');
        downloadBtn.classList.remove('hidden');
        moveBtn.classList.remove('hidden');
        
        // Edit title button only appears when one note is selected
        if (selectedNotes.length === 1) {
            editTitleBtn.classList.remove('hidden');
        } else {
            editTitleBtn.classList.add('hidden');
        }
    } else {
        deleteBtn.classList.add('hidden');
        editTitleBtn.classList.add('hidden');
        downloadBtn.classList.add('hidden');
        moveBtn.classList.add('hidden');
    }
}

// Delete selected notes
function deleteSelectedNotes() {
    if (selectedNotes.length === 0) return;
    
    const confirmMessage = selectedNotes.length === 1 
        ? 'Are you sure you want to delete this note?' 
        : `Are you sure you want to delete these ${selectedNotes.length} notes?`;
    
    if (confirm(confirmMessage)) {
        // Remove selected notes from appData.notes
        appData.notes = appData.notes.filter(note => !selectedNotes.includes(note.id));
        
        // Clear selected notes array
        selectedNotes = [];
        
        // Re-render notes and update buttons
        renderNotes();
        updateActionButtons();
    }
}

// Open edit title modal
function openEditTitleModal() {
    if (selectedNotes.length !== 1) return;
    
    const noteId = selectedNotes[0];
    const note = appData.notes.find(n => n.id === noteId);
    
    if (note) {
        editTitleModal.classList.remove('hidden');
        document.getElementById('edit-note-title').value = note.title;
    }
}

// Save edited note title
function saveEditedTitle() {
    if (selectedNotes.length !== 1) return;
    
    const newTitle = document.getElementById('edit-note-title').value.trim();
    if (!newTitle) return;
    
    const noteId = selectedNotes[0];
    const note = appData.notes.find(n => n.id === noteId);
    
    if (note) {
        note.title = newTitle;
        editTitleModal.classList.add('hidden');
        renderNotes();
    }
}

// Download selected notes
function downloadSelectedNotes() {
    if (selectedNotes.length === 0) return;
    
    const selectedNotesData = appData.notes.filter(note => selectedNotes.includes(note.id));
    
    if (selectedNotesData.length === 1) {
        // Download single note
        const note = selectedNotesData[0];
        const content = `# ${note.title}\n\n${note.content}`;
        const filename = `${note.title.replace(/[^a-zA-Z0-9]/g, '_')}.md`;
        downloadFile(content, filename, 'text/markdown');
    } else {
        // Download multiple notes as combined markdown
        let combinedContent = '';
        selectedNotesData.forEach(note => {
            combinedContent += `# ${note.title}\n\n${note.content}\n\n---\n\n`;
        });
        
        const currentLesson = appData.lessons.find(lesson => lesson.id === currentLessonId);
        const currentUnit = currentLesson?.units.find(unit => unit.id === currentUnitId);
        const filename = `${currentUnit?.title || 'notes'}_${selectedNotesData.length}_notes.md`;
        
        downloadFile(combinedContent, filename.replace(/[^a-zA-Z0-9]/g, '_'), 'text/markdown');
    }
}

// Helper function to download file
function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
}

// Open move notes modal
function openMoveNotesModal() {
    if (selectedNotes.length === 0) return;
    
    // Populate lesson options
    populateLessonOptions();
    
    moveNotesModal.classList.remove('hidden');
}

// Populate lesson options in the move modal
function populateLessonOptions() {
    moveLessonSelect.innerHTML = '';
    
    appData.lessons.forEach(lesson => {
        const option = document.createElement('option');
        option.value = lesson.id;
        option.textContent = lesson.title;
        moveLessonSelect.appendChild(option);
    });
    
    // Set current lesson as selected by default
    moveLessonSelect.value = currentLessonId;
    
    // Populate units for the selected lesson
    populateUnitOptions();
}

// Populate unit options based on selected lesson
function populateUnitOptions() {
    const selectedLessonId = parseInt(moveLessonSelect.value);
    const selectedLesson = appData.lessons.find(lesson => lesson.id === selectedLessonId);
    
    moveUnitSelect.innerHTML = '';
    
    if (selectedLesson) {
        selectedLesson.units.forEach(unit => {
            const option = document.createElement('option');
            option.value = unit.id;
            option.textContent = unit.title;
            moveUnitSelect.appendChild(option);
        });
    }
}

// Move selected notes to new location
function moveSelectedNotes() {
    if (selectedNotes.length === 0) return;
    
    const newLessonId = parseInt(moveLessonSelect.value);
    const newUnitId = parseInt(moveUnitSelect.value);
    
    if (!newLessonId || !newUnitId) return;
    
    // Update the lesson and unit for selected notes
    selectedNotes.forEach(noteId => {
        const note = appData.notes.find(n => n.id === noteId);
        if (note) {
            note.lessonId = newLessonId;
            note.unitId = newUnitId;
        }
    });
    
    // Clear selected notes and close modal
    selectedNotes = [];
    moveNotesModal.classList.add('hidden');
    
    // Re-render notes and update buttons
    renderNotes();
    updateActionButtons();
}

// Initialize the app
document.addEventListener('DOMContentLoaded', initApp);
    </script>
