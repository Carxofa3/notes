{% extends "base.html" %}

{% block title %}My Notes{% endblock %}

{% block content %}
<div class="container">
    <div class="sidebar">
        <h2>Lessons</h2>
        <ul id="lessons-list">
            <!-- Lessons will be populated by JavaScript -->
        </ul>
        <button id="add-lesson-btn">Add Lesson</button>
        <div class="sidebar-footer">
            <button id="settings-btn">Settings</button>
        </div>
    </div>
    <div class="main-content">
        <div class="search-container">
            <input type="search" id="search-bar" placeholder="Search notes...">
            <div id="search-results"></div>
        </div>
        <div class="units-section">
            <div class="section-header">
                <h2>Units</h2>
                <button id="add-unit-btn" style="display: none;">Add Unit</button>
            </div>
            <ul id="units-list">
                <!-- Units will be populated by JavaScript -->
            </ul>
        </div>
        <div class="notes-section">
            <div class="section-header">
                <h2>Notes</h2>
                <button id="add-note-btn" style="display: none;">Add Note</button>
            </div>
            <ul id="notes-list">
                <!-- Notes will be populated by JavaScript -->
            </ul>
        </div>
        <div class="editor-section">
            <h2>Editor</h2>
            <input type="text" id="note-title" placeholder="Note Title">
            <textarea id="note-editor"></textarea>
            <button id="save-note-btn">Save Note</button>
            <button id="ai-format-btn">AI Format</button>
            <input type="file" id="image-upload-input" style="display: none;" accept="image/*">
            <button id="upload-image-btn">Upload Image</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Settings</h2>
        <div class="settings-form">
            <h3>Appearance</h3>
            <label for="primary-color">Primary Color:</label>
            <input type="color" id="primary-color" name="primary-color">

            <h3>LLM Configuration</h3>
            <label for="llm-api-key">LLM API Key:</label>
            <input type="password" id="llm-api-key" name="llm-api-key">

            <label for="llm-api-base">LLM API Base URL:</label>
            <input type="text" id="llm-api-base" name="llm-api-base">

            <label for="llm-model">LLM Model:</label>
            <input type="text" id="llm-model" name="llm-model">

            <h3>Embeddings Configuration</h3>
            <label for="embeddings-api-key">Embeddings API Key:</label>
            <input type="password" id="embeddings-api-key" name="embeddings-api-key">

            <label for="embeddings-api-base">Embeddings API Base URL:</label>
            <input type="text" id="embeddings-api-base" name="embeddings-api-base">

            <label for="embeddings-model">Embeddings Model:</label>
            <input type="text" id="embeddings-model" name="embeddings-model">

            <button id="save-settings-btn">Save Settings</button>
        </div>
    </div>
</div>
{% endblock %}
